<?xml version="1.0" encoding="UTF-8"?>
<!-- Source: docs/architecture.html. Keep this exported SVG synchronized with the inline figure. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">ConduitVPN 生产运行架构</title>
  <desc id="architecture-desc">ConduitVPN 通过统一的监督状态机拉取和选择 VPNGate 节点，并在容器全隧道或宿主机定向隧道模式下为 HTTP、SOCKS5 和可选 hysteria2 提供代理服务。</desc>
  <defs>
    <marker id="architecture-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#0066ff"/></marker>
    <marker id="architecture-arrow-muted" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M 0 0 L 8 4 L 0 8 z" fill="#86868f"/></marker>
    <style>
      .bg { fill: #f6f6f8; } .zone { fill: #ffffff; stroke: #e5e5ea; stroke-width: 1; }
      .node { fill: #ffffff; stroke: #d4d4db; stroke-width: 1.2; } .focal { fill: rgba(0,102,255,.09); stroke: #0066ff; stroke-width: 1.4; }
      .mode { fill: #ffffff; stroke: rgba(0,102,255,.32); stroke-width: 1.2; } .tag { fill: #ffffff; stroke: #d4d4db; stroke-width: .8; } .tag-blue { fill: #ffffff; stroke: rgba(0,102,255,.32); stroke-width: .8; }
      .zone-label { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #86868f; letter-spacing: .12em; } .tag-text { font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #52525b; letter-spacing: .08em; }
      .name { font: 600 16px -apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif; fill: #18181b; } .sub { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #52525b; } .sub-soft { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #86868f; }
      .line { fill: none; stroke: #0066ff; stroke-width: 2; marker-end: url(#architecture-arrow); } .line-muted { fill: none; stroke: #86868f; stroke-width: 1.4; stroke-dasharray: 6 5; marker-end: url(#architecture-arrow-muted); }
      .label-bg { fill: #f6f6f8; } .line-label { font: 600 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #52525b; letter-spacing: .06em; } .legend { font: 12px -apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif; fill: #52525b; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="920" rx="8"/>
  <rect class="zone" x="40" y="52" width="264" height="596" rx="8"/><text class="zone-label" x="64" y="84">CLIENTS</text>
  <rect class="zone" x="344" y="52" width="512" height="596" rx="8"/><text class="zone-label" x="368" y="84">CONDUITVPN CONTROL PLANE</text>
  <rect class="zone" x="896" y="52" width="504" height="596" rx="8"/><text class="zone-label" x="920" y="84">VPN TRANSPORT</text>
  <path class="line" d="M 280 232 H 328 Q 344 232 344 248 V 260 Q 344 276 360 276 H 400"/><path class="line" d="M 280 436 H 328 Q 344 436 344 420 V 356 Q 344 340 360 340 H 400"/>
  <path class="line-muted" d="M 536 412 V 460 Q 536 476 552 476 H 576"/><path class="line-muted" d="M 712 412 V 460 Q 712 476 696 476 H 680"/>
  <path class="line" d="M 848 504 H 864 Q 880 504 880 488 V 228 Q 880 212 896 212 H 944"/><path class="line-muted" d="M 848 540 H 880 Q 896 540 896 524 V 436 Q 896 420 912 420 H 944"/>
