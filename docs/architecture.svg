  <path class="line" d="M 1176 692 H 1200 Q 1216 692 1216 676 V 500"/><path class="line" d="M 1176 820 H 1200 Q 1216 820 1216 804 V 500"/>
  <rect class="label-bg" x="824" y="304" width="80" height="16" rx="3"/><text class="line-label" x="864" y="316" text-anchor="middle">FETCH</text><rect class="label-bg" x="504" y="640" width="112" height="16" rx="3"/><text class="line-label" x="560" y="652" text-anchor="middle">CONTAINER FLOW</text><rect class="label-bg" x="812" y="768" width="104" height="16" rx="3"/><text class="line-label" x="864" y="780" text-anchor="middle">HOST FLOW</text>
  <rect class="node" x="64" y="144" width="216" height="112" rx="6"/><rect class="tag" x="80" y="160" width="56" height="20" rx="3"/><text class="tag-text" x="108" y="174" text-anchor="middle">CLIENT</text><text class="name" x="88" y="208">代理客户端</text><text class="sub" x="88" y="232">HTTP / SOCKS5 / hy2*</text>
  <rect class="node" x="64" y="380" width="216" height="112" rx="6"/><rect class="tag" x="80" y="396" width="40" height="20" rx="3"/><text class="tag-text" x="100" y="410" text-anchor="middle">WEB</text><text class="name" x="88" y="444">管理浏览器</text><text class="sub" x="88" y="468">HTTPS / REST + SSE</text>
  <rect class="node" x="400" y="212" width="400" height="200" rx="6"/><rect class="tag-blue" x="416" y="228" width="88" height="20" rx="3"/><text class="tag-text" x="460" y="242" text-anchor="middle">RUNTIME</text><text class="name" x="424" y="280">代理入口</text><text class="sub" x="424" y="304">HTTP + SOCKS5 首字节嗅探 :7928</text><line x1="424" y1="328" x2="776" y2="328" stroke="#e5e5ea"/><text class="name" x="424" y="360">Web UI</text><text class="sub" x="424" y="384">随机安全路径 :8787</text><text class="sub-soft" x="680" y="360" text-anchor="middle">hy2 :7929/udp</text><text class="sub-soft" x="680" y="384" text-anchor="middle">仅 container 模式</text>
  <rect class="focal" x="576" y="460" width="272" height="116" rx="6"/><rect class="tag-blue" x="592" y="476" width="104" height="20" rx="3"/><text class="tag-text" x="644" y="490" text-anchor="middle">SUPERVISOR</text><text class="name" x="600" y="528">监督状态机</text><text class="sub" x="600" y="552">拉取 · 测速 · 连接 · 探测 · 漂移</text>
  <rect class="node" x="400" y="460" width="136" height="116" rx="6"/><rect class="tag" x="416" y="476" width="56" height="20" rx="3"/><text class="tag-text" x="444" y="490" text-anchor="middle">STATE</text><text class="name" x="424" y="528">状态与日志</text><text class="sub" x="424" y="552">JSON / SSE</text>
  <rect class="node" x="944" y="156" width="232" height="112" rx="6"/><rect class="tag" x="960" y="172" width="56" height="20" rx="3"/><text class="tag-text" x="988" y="186" text-anchor="middle">SOURCE</text><text class="name" x="968" y="220">VPNGate API</text><text class="sub" x="968" y="244">节点列表 / OpenVPN 配置</text>
  <rect class="node" x="944" y="348" width="456" height="152" rx="6"/><rect class="tag" x="960" y="364" width="72" height="20" rx="3"/><text class="tag-text" x="996" y="378" text-anchor="middle">TUNNEL</text><text class="name" x="968" y="424">openvpn 进程 + tun0 / utun</text><text class="sub" x="968" y="452">握手、优雅停止、进程回收</text><text class="sub-soft" x="1368" y="424" text-anchor="end">VPNGate 节点</text>
  <rect class="mode" x="944" y="636" width="232" height="112" rx="6"/><rect class="tag-blue" x="960" y="652" width="112" height="20" rx="3"/><text class="tag-text" x="1016" y="666" text-anchor="middle">CONTAINER</text><text class="name" x="968" y="704">方案 B 全隧道</text><text class="sub" x="968" y="728">netfix + redirect-gateway</text>
  <rect class="mode" x="944" y="764" width="232" height="112" rx="6"/><rect class="tag-blue" x="960" y="780" width="64" height="20" rx="3"/><text class="tag-text" x="992" y="794" text-anchor="middle">HOST</text><text class="name" x="968" y="832">方案 A 定向隧道</text><text class="sub" x="968" y="856">egress：mark / IP_BOUND_IF</text>
  <line x1="40" y1="888" x2="1400" y2="888" stroke="#e5e5ea"/><line x1="64" y1="916" x2="104" y2="916" stroke="#0066ff" stroke-width="2" marker-end="url(#architecture-arrow)"/><text class="legend" x="120" y="920">主要流量 / 控制调用</text><line x1="336" y1="916" x2="376" y2="916" stroke="#86868f" stroke-width="1.4" stroke-dasharray="6 5" marker-end="url(#architecture-arrow-muted)"/><text class="legend" x="392" y="920">状态、日志与模式专属关系</text><text class="sub-soft" x="1400" y="920" text-anchor="end">* hy2 仅 NETWORK_MODE=container</text>
</svg>
