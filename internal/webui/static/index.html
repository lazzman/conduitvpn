<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>ConduitVPN · Gateway</title>
<link rel="stylesheet" href="./styles.css?v=__VER__">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"><span>▲</span></div>
    <div class="brand-text">
      <span class="brand-name">CONDUITVPN</span>
      <span class="brand-sub">VPN GATEWAY</span>
    </div>
  </div>
  <div class="topbar-right">
    <div id="theme-menu-wrap" class="theme-menu-wrap">
      <button id="btn-theme" class="btn btn-ghost btn-icon" title="主题：跟随系统" aria-label="打开主题菜单" aria-haspopup="menu" aria-expanded="false">
        <svg id="icon-theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l-1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg id="icon-theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg id="icon-theme-monitor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      </button>
      <div id="theme-menu" class="theme-menu" role="menu" hidden>
        <button class="theme-option" type="button" role="menuitemradio" data-theme="system" title="跟随系统" aria-label="跟随系统" aria-checked="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
        </button>
        <button class="theme-option" type="button" role="menuitemradio" data-theme="dark" title="深色" aria-label="深色" aria-checked="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="theme-option" type="button" role="menuitemradio" data-theme="light" title="浅色" aria-label="浅色" aria-checked="false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l-1.41 1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
      </div>
    </div>
    <button id="btn-refresh" class="btn" title="立即拉取并测速">更新节点</button>
    <div id="status-pill" class="pill pill-idle">
      <span class="dot" aria-hidden="true"></span>
      <span id="status-text">IDLE</span>
    </div>
  </div>
</header>

<main class="layout">
  <section class="cards" aria-label="网关状态">
    <div class="card">
      <div class="card-label">当前节点</div>
      <div id="c-node" class="card-value mono">—</div>
      <div id="c-node-sub" class="card-sub mono">—</div>
    </div>
    <div class="card">
      <div class="card-label">隧道出口</div>
      <div id="c-egress" class="card-value mono">—</div>
      <div id="c-egress-sub" class="card-sub mono">—</div>
    </div>
    <div class="card">
      <div class="card-label">代理端口</div>
      <div id="c-proxy" class="card-value mono">—</div>
      <div id="c-proxy-sub" class="card-sub">HTTP + SOCKS5 · 单端口</div>
    </div>
    <div class="card">
      <div class="card-label">运行时长</div>
      <div id="c-uptime" class="card-value mono">—</div>
      <div id="c-blacklist" class="card-sub">—</div>
    </div>
  </section>

  <section class="panel" aria-label="路由模式">
    <div class="panel-head">
      <h2>路由模式</h2>
      <span id="route-status" class="card-sub mono">智能自动配置</span>
    </div>
    <div class="route-body">
      <div class="seg" id="route-seg" role="tablist">
        <button class="seg-btn active" data-mode="auto" role="tab">智能</button>
        <button class="seg-btn" data-mode="country" role="tab">固定国家地区</button>
        <button class="seg-btn" data-mode="fixed" role="tab">固定 IP</button>
      </div>
      <div id="route-country-list" class="country-chips" hidden></div>
      <select id="route-node" class="input input-wide" hidden>
        <option value="">选择节点…</option>
      </select>
      <button id="btn-route-apply" class="btn">应用</button>
      <span id="route-msg" class="route-msg"></span>
    </div>
  </section>

  <section class="panel" aria-label="实时延迟">
    <div class="panel-head">
      <h2>实时延迟</h2>
      <span id="lat-summary" class="card-sub mono">—</span>
    </div>
    <div class="chart-wrap">
      <canvas id="lat-chart" height="150"></canvas>
    </div>
  </section>

  <section class="panel" aria-label="节点列表">
    <div class="panel-head">
      <h2>节点</h2>
      <div class="panel-actions">
        <input id="node-filter" class="input" type="search" placeholder="过滤…" autocomplete="off">
        <span id="node-count" class="count mono">0</span>
      </div>
    </div>
    <div class="table-wrap">
      <table id="node-table">
        <thead>
          <tr>
            <th class="num" data-sort="latency" data-dir="-1">延迟 <span class="sort-hint">↓</span></th>
            <th data-sort="country">国家地区</th>
            <th data-sort="host">主机</th>
            <th data-sort="ip">IP</th>
            <th data-sort="proto">协议</th>
            <th class="num" data-sort="score">分数</th>
            <th class="num" data-sort="ping">Ping</th>
            <th class="act-col">操作</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section class="panel" aria-label="实时日志">
    <div class="panel-head">
      <h2>日志</h2>
      <div class="panel-actions">
        <div class="chips" id="log-chips">
          <button class="chip active" data-level="all">全部</button>
          <button class="chip" data-level="warn">警告</button>
          <button class="chip" data-level="error">错误</button>
        </div>
        <button id="btn-scroll" class="btn btn-ghost active" title="自动滚动">跟随</button>
        <button id="btn-clear-log" class="btn btn-ghost">清空</button>
      </div>
    </div>
    <pre id="log-view" class="log-view mono"></pre>
  </section>
</main>

<footer class="site-footer">
  <a href="https://github.com/sarices/conduitvpn" target="_blank" rel="noreferrer">GitHub</a>
  <span>Copyright © 2026 ConduitVPN</span>
</footer>

<script src="./app.js?v=__VER__"></script>
</body>
</html>
